<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feature Ledger</title>
<style>
  :root {
    --paper: #fbfaf7; --sheet: #ffffff; --ink: #1f1e1b; --ink-2: #4a4843; --muted: #7a776f; --faint: #a7a39a;
    --line: #e8e5de; --line-2: #f1efe9; --hover: #f4f2ec;
    --accent: #1b5e9e; --good: #2f7a4a; --warn: #a3590a; --bad: #b3261e;
    --mono: "Cascadia Mono", ui-monospace, Consolas, monospace;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #161614; --sheet: #1c1c1a; --ink: #ecebe6; --ink-2: #c9c7c0; --muted: #96938a; --faint: #6c6a63;
      --line: #2e2d2a; --line-2: #252522; --hover: #24231f;
      --accent: #7fb0e6; --good: #7cc495; --warn: #e5a35a; --bad: #f08a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 14.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select { font: inherit; color: var(--ink); }
  .key { font: 500 13px var(--mono); letter-spacing: -.01em; }
  code { font: 12.5px var(--mono); color: var(--ink-2); }
  .muted { color: var(--muted); }
  .good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }

  /* top line */
  .top { display: flex; align-items: center; gap: 24px; padding: 14px 28px; border-bottom: 1px solid var(--line); background: var(--paper); position: sticky; top: 0; z-index: 3; }
  .wordmark { font: 600 15px var(--display); letter-spacing: -.01em; white-space: nowrap; }
  .wordmark span { color: var(--muted); font-weight: 400; }
  form.go { flex: 1; max-width: 560px; display: flex; align-items: center; gap: 14px; }
  .go input[type=text] { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; padding: 7px 10px; font: 500 13.5px var(--mono); text-transform: uppercase; }
  .go input[type=text]::placeholder { text-transform: none; font-family: var(--sans); color: var(--faint); }
  .go input[type=text]:focus { outline: none; border-color: var(--accent); }
  .go label { display: flex; gap: 5px; align-items: center; font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; }
  .who { margin-left: auto; font-size: 13.5px; white-space: nowrap; }
  .textbtn { background: none; border: 0; padding: 0; color: var(--accent); }
  .textbtn:hover { text-decoration: underline; text-underline-offset: 2px; }
  .textbtn:disabled { color: var(--faint); cursor: default; text-decoration: none; }

  .frame { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 54px); }
  @media (max-width: 920px) { .frame { grid-template-columns: 1fr; } nav.side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; } }

  /* left: an inbox of your tickets */
  nav.side { border-right: 1px solid var(--line); padding: 18px 0 24px; overflow: auto; max-height: calc(100vh - 54px); position: sticky; top: 54px; }
  .side h2 { font: 600 12px var(--sans); color: var(--muted); margin: 0; padding: 0 20px; display: flex; align-items: baseline; gap: 8px; }
  .side h2 + * { margin-top: 8px; }
  .side .ctl { padding: 0 20px; display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .side select { border: 0; background: none; color: var(--accent); padding: 0; font-size: 12.5px; cursor: pointer; }
  .parent { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 14px 20px 4px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.parent:hover { color: var(--accent); }
  .parent .key { font-size: 11.5px; color: var(--ink-2); }
  .row { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 20px 7px 20px; border-left: 2px solid transparent; }
  .row:hover { background: var(--hover); }
  .row.on { background: var(--hover); border-left-color: var(--ink); }
  .row .l1 { display: flex; gap: 8px; align-items: baseline; }
  .row .l1 .st { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .row .t { font-size: 13.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; transform: translateY(-1px); }
  .dot.good { background: var(--good); } .dot.warn { background: var(--warn); }
  .side .note { padding: 6px 20px; font-size: 13px; color: var(--muted); }
  .side hr { border: 0; border-top: 1px solid var(--line); margin: 22px 20px 18px; }

  /* right: the ticket, written out like a handover note */
  main { padding: 36px 48px 80px; min-width: 0; }
  @media (max-width: 700px) { main { padding: 24px 18px 60px; } .top { padding: 12px 16px; gap: 12px; flex-wrap: wrap; } }
  article { max-width: 920px; }
  .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 8px; }
  .crumbs button { border: 0; background: none; padding: 0; color: var(--muted); }
  .crumbs button:hover { color: var(--accent); }
  .ident { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .ident .key { font-size: 14px; }
  h1 { font: 600 27px/1.25 var(--display); letter-spacing: -.015em; margin: 4px 0 8px; max-width: 760px; }
  .facts { color: var(--muted); font-size: 13.5px; }
  .facts b { color: var(--ink-2); font-weight: 500; }
  .tools { display: flex; gap: 18px; margin-top: 14px; font-size: 13.5px; flex-wrap: wrap; }

  .verdict { margin: 30px 0 8px; padding: 2px 0 2px 18px; border-left: 3px solid var(--line); }
  .verdict.ok { border-color: var(--good); } .verdict.no { border-color: var(--warn); }
  .verdict h2 { font: 600 19px var(--display); margin: 0 0 6px; letter-spacing: -.01em; }
  .verdict p { margin: 0; color: var(--ink-2); }
  .todo { list-style: none; margin: 10px 0 0; padding: 0; }
  .todo li { padding: 3px 0 3px 22px; position: relative; color: var(--ink-2); }
  .todo li::before { content: ""; position: absolute; left: 2px; top: 9px; width: 9px; height: 9px; border: 1.5px solid var(--warn); border-radius: 2px; }
  .open-in-jira { margin-top: 12px; font-size: 13.5px; color: var(--muted); }

  section.s { margin-top: 40px; }
  section.s > h3 { font: 600 13px var(--sans); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
  section.s > h3 .c { text-transform: none; letter-spacing: 0; font-weight: 400; }
  section.s > p.lead { margin: -2px 0 12px; color: var(--muted); font-size: 13.5px; }

  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 9px 12px 9px 0; vertical-align: top; text-align: left; border-bottom: 1px solid var(--line-2); }
  th { font-weight: 500; font-size: 12.5px; color: var(--muted); padding-top: 0; }
  tr:last-child td { border-bottom: 0; }
  td.nw { white-space: nowrap; }
  td .sub { font-size: 12.5px; color: var(--muted); }
  tr.you td:first-child { box-shadow: inset 2px 0 0 var(--accent); padding-left: 10px; }
  .lvl1 { padding-left: 18px !important; } .lvl2 { padding-left: 36px !important; }
  .tablewrap { overflow-x: auto; }

  .plain { list-style: none; margin: 0; padding: 0; }
  .plain li { padding: 5px 0; border-bottom: 1px solid var(--line-2); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .plain li:last-child { border-bottom: 0; }
  .plain .r { color: var(--muted); font-size: 13px; min-width: 150px; }

  details.more { margin-top: 10px; border-top: 1px solid var(--line); }
  details.more > summary { list-style: none; cursor: pointer; padding: 12px 0; color: var(--ink-2); display: flex; gap: 8px; align-items: baseline; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::before { content: "+"; font: 500 14px var(--mono); color: var(--muted); width: 12px; }
  details.more[open] > summary::before { content: "–"; }
  details.more > summary .c { color: var(--muted); font-size: 13px; }
  .inner { padding: 0 0 18px 20px; }
  .inner h4 { font: 600 13px var(--sans); margin: 14px 0 4px; }
  .inner h4:first-child { margin-top: 0; }
  .files { list-style: none; margin: 0; padding: 0; columns: 1; }
  .files li { padding: 2px 0; font: 12.5px/1.6 var(--mono); color: var(--ink-2); word-break: break-all; }
  .files .op { display: inline-block; width: 16px; color: var(--muted); }
  .files .op.A { color: var(--good); } .files .op.D { color: var(--bad); }
  .commit { padding: 6px 0; border-bottom: 1px solid var(--line-2); }
  .commit:last-child { border-bottom: 0; }
  .commit .m { font-size: 12.5px; color: var(--muted); }
  .commit .n { font-size: 12.5px; color: var(--warn); }
  .inline-ctl { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .inline-ctl input, .inline-ctl select { border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; background: var(--sheet); font-size: 13px; }

  .blank { max-width: 560px; margin-top: 8vh; color: var(--ink-2); }
  .blank h1 { font-size: 24px; }
  .blank p { margin: 0 0 12px; }
  .blank ol { padding-left: 20px; margin: 16px 0; }
  .blank li { margin: 6px 0; }
  .working { margin-top: 8vh; color: var(--muted); }
  .working .key { color: var(--ink); font-size: 15px; }
  .working p { margin: 6px 0; }
  .bar { height: 2px; background: var(--line); width: 220px; margin-top: 14px; overflow: hidden; position: relative; }
  .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--ink-2); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .err { margin-top: 8vh; color: var(--bad); max-width: 620px; }

  /* account sheet */
  dialog { border: 1px solid var(--line); border-radius: 8px; padding: 26px 28px 22px; width: min(480px, calc(100vw - 32px)); background: var(--sheet); color: var(--ink); box-shadow: 0 24px 60px rgba(0,0,0,.18); }
  dialog::backdrop { background: rgba(20,19,16,.35); }
  dialog h2 { font: 600 18px var(--display); margin: 0 0 4px; }
  dialog h3 { font: 600 13px var(--sans); margin: 22px 0 2px; }
  dialog p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
  .f { display: block; margin-top: 12px; }
  .f span { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; }
  .f input { width: 100%; border: 1px solid var(--line); border-radius: 5px; padding: 7px 9px; background: var(--paper); }
  .f input:focus { outline: none; border-color: var(--accent); }
  .f small { display: block; margin-top: 4px; color: var(--muted); font-size: 12.5px; }
  .actions { display: flex; gap: 16px; align-items: center; margin-top: 18px; }
  .btn { border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 5px; padding: 6px 14px; font-weight: 500; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.quiet { background: none; color: var(--ink); border-color: var(--line); }
  .say { font-size: 13px; }
  .close { position: absolute; top: 14px; right: 16px; border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 12px); opacity: 0; transition: .18s; background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: 6px; font-size: 13.5px; z-index: 9; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast a { color: inherit; text-decoration: underline; }
</style>
</head>
<body>
<header class="top">
  <div class="wordmark">Feature Ledger <span>· what a ticket touched</span></div>
  <form class="go" id="go" autocomplete="off">
    <input type="text" id="keyInput" placeholder="Open a ticket, e.g. MM-1234" aria-label="Ticket key" spellcheck="false">
    <label title="Include the ticket's sub-tasks, or for an epic everything under it"><input type="checkbox" id="childrenBox" checked> with sub-tasks</label>
    <label title="git fetch every repo first: slower, but includes work pushed from other machines"><input type="checkbox" id="fetchBox" checked> fetch</label>
  </form>
  <div class="who" id="who"></div>
</header>

<div class="frame">
  <nav class="side" aria-label="Your tickets">
    <h2>Assigned to you <span class="muted" id="mineCount" style="font-weight:400"></span></h2>
    <div class="ctl" id="mineCtl"></div>
    <div id="mine"></div>
    <hr>
    <h2>Recently checked</h2>
    <div id="recent"></div>
  </nav>
  <main><article id="doc"></article></main>
</div>

<dialog id="acct">
  <button class="close" id="acctClose" aria-label="Close">×</button>
  <div id="acctBody"></div>
  <h3>Where your repositories are</h3>
  <p>The folder that holds your clones, one repository per subfolder.</p>
  <label class="f"><input id="reposRoot" spellcheck="false" aria-label="Repositories folder"></label>
  <div class="actions"><button class="btn quiet" id="saveRepos">Save folder</button><span class="say" id="reposSay"></span></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const a = (text, url) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text);
const n = (k, word, plural) => `${k} ${k === 1 ? word : (plural || word + "s")}`;
const branchName = ref => (ref || "").replace(/^origin\//, "");
const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const day = d => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ""); return m ? `${+m[3]} ${months[+m[2] - 1]}` : esc(d); };

let status = null, current = null, mine = null, mineStatus = "", commitTicket = "";

function toast(html, ms = 3500) {
  const t = $("#toast"); t.innerHTML = html; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), ms);
}

async function api(path, opts = {}) {
  if (opts.method && opts.method !== "GET") opts.headers = { "X-Ledger": "1", "Content-Type": "application/json" };
  const res = await fetch(path, opts);
  const body = res.headers.get("content-type")?.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(body?.error || res.statusText);
  return body;
}

/* ───────── account ───────── */

async function loadStatus() {
  try { status = await api("/api/status"); }
  catch { $("#who").innerHTML = `<span class="bad">The ledger server isn't running.</span>`; return; }
  const me = status.account;
  $("#who").innerHTML = me
    ? `<button class="textbtn" id="whoBtn" title="Account and settings">${esc(me.name)}</button>`
    : `<button class="textbtn" id="whoBtn">${status.credentialsRejected ? "Jira rejected your token. Reconnect" : "Connect your Jira account"}</button>`;
  $("#whoBtn").onclick = openAccount;
  renderRecent();
}

function openAccount() {
  const me = status?.account;
  $("#acctBody").innerHTML = me ? `
    <h2>${esc(me.name)}</h2>
    <p>${esc(me.email)} on ${esc(status.jiraBaseUrl.replace("https://", ""))}.<br>Your API token is kept in ${esc(me.source)} on this computer.</p>
    <div class="actions"><button class="btn quiet" id="disconnect">Disconnect</button></div>` : `
    <h2>Connect your Jira account</h2>
    <p>Everything the ledger does in Jira, like listing your tickets and posting comments, happens as you. The token stays in Windows Credential Manager on this computer.</p>
    ${status?.credentialsRejected ? `<p class="bad">The saved token no longer works. Enter a new one.</p>` : ""}
    <label class="f"><span>Jira site</span><input id="jSite" value="${esc(status?.jiraBaseUrl || "")}" spellcheck="false"></label>
    <label class="f"><span>The email you sign in to Atlassian with</span><input id="jEmail" type="email" autocomplete="username" spellcheck="false">
      <small>This can differ from the address Jira shows on your profile. Use the one you type on the Atlassian login page.</small></label>
    <label class="f"><span>API token</span><input id="jToken" type="password" autocomplete="off">
      <small><a href="https://id.atlassian.com/manage-profile/security/api-tokens" target="_blank" rel="noopener">Create one here</a> while signed in as yourself, then paste it.</small></label>
    <div class="actions"><button class="btn" id="connect">Connect</button><span class="say" id="jSay"></span></div>`;
  $("#reposRoot").value = status?.reposRoot || "";
  $("#reposSay").textContent = "";

  if (me) $("#disconnect").onclick = async () => {
    await api("/api/account/disconnect", { method: "POST" });
    await loadStatus(); loadMine(); openAccount();
    toast("Disconnected. The token was removed from this computer.");
  };
  else $("#connect").onclick = async () => {
    const say = $("#jSay"), btn = $("#connect");
    btn.disabled = true; say.className = "say muted"; say.textContent = "Checking with Jira…";
    try {
      const who = await api("/api/account", { method: "POST", body: JSON.stringify({ baseUrl: $("#jSite").value, email: $("#jEmail").value, token: $("#jToken").value }) });
      say.className = "say good"; say.textContent = `Connected as ${who.name}.`;
      await loadStatus(); loadMine(); openAccount();
    } catch (e) { say.className = "say bad"; say.textContent = e.message; }
    finally { btn.disabled = false; }
  };
  if (!$("#acct").open) $("#acct").showModal();
}

$("#acctClose").onclick = () => $("#acct").close();
$("#saveRepos").onclick = async () => {
  const say = $("#reposSay");
  try {
    const r = await api("/api/settings", { method: "POST", body: JSON.stringify({ reposRoot: $("#reposRoot").value }) });
    say.className = "say good"; say.textContent = `Found ${n(r.repoCount, "repository", "repositories")}.`;
    loadStatus();
  } catch (e) { say.className = "say bad"; say.textContent = e.message; }
};

/* ───────── left: your tickets, under their story or epic ───────── */

async function loadMine() {
  if (!status?.account) {
    mine = null; $("#mineCount").textContent = ""; $("#mineCtl").innerHTML = "";
    $("#mine").innerHTML = `<p class="note">Connect your Jira account and the tickets assigned to you that aren't done will be listed here. <button class="textbtn" id="mineConnect">Connect</button></p>`;
    $("#mineConnect").onclick = openAccount;
    return;
  }
  $("#mine").innerHTML = `<p class="note">Asking Jira…</p>`;
  try { mine = await api("/api/my-tickets"); renderMine(); }
  catch (e) { $("#mine").innerHTML = `<p class="note bad">${esc(e.message)}</p>`; }
}

function renderMine() {
  if (!mine) return;
  $("#mineCount").textContent = mine.length;
  const statuses = [...new Set(mine.map(i => i.status))];
  $("#mineCtl").innerHTML = `<span>Showing</span><select id="mineSel" aria-label="Filter by status"><option value="">every status</option>${statuses.map(s => `<option ${s === mineStatus ? "selected" : ""}>${esc(s)}</option>`).join("")}</select><button class="textbtn" id="mineReload" style="margin-left:auto">Reload</button>`;
  $("#mineSel").onchange = e => { mineStatus = e.target.value; renderMine(); };
  $("#mineReload").onclick = loadMine;

  const list = mine.filter(i => !mineStatus || i.status === mineStatus);
  if (!list.length) { $("#mine").innerHTML = `<p class="note">${mine.length ? "Nothing in this status." : "Nothing open is assigned to you."}</p>`; return; }

  const groups = new Map();
  for (const i of list) {
    const g = i.parentKey || "";
    if (!groups.has(g)) groups.set(g, { key: i.parentKey, summary: i.parentSummary, type: i.parentType, items: [] });
    groups.get(g).items.push(i);
  }
  const ordered = [...groups.values()].sort((x, y) => (x.key ? 1 : 0) - (y.key ? 1 : 0));
  $("#mine").innerHTML = ordered.map(g => `
    ${g.key ? `<button class="parent" data-key="${esc(g.key)}" title="Open the whole ${esc((g.type || "parent").toLowerCase())}, including other people's sub-tasks">${esc(g.type || "Parent")} <span class="key">${esc(g.key)}</span> · ${esc(g.summary)}</button>`
            : (ordered.length > 1 ? `<div class="parent">On their own</div>` : "")}
    ${g.items.map(i => {
      const lb = i.lastBuild;
      const dot = lb ? `<span class="dot ${lb.warnings ? "warn" : "good"}" title="${lb.warnings ? n(lb.warnings, "thing") + " to fix, checked " + esc(lb.generated) : "Ready, checked " + esc(lb.generated)}"></span>` : "";
      return `<button class="row ${current?.key === i.key ? "on" : ""}" data-key="${esc(i.key)}">
        <span class="l1"><span class="key">${esc(i.key)}</span>${dot}<span class="st">${esc(i.status)}</span></span>
        <span class="t">${esc(i.summary)}</span></button>`;
    }).join("")}`).join("");
  $("#mine").querySelectorAll("[data-key]").forEach(b => b.onclick = () => open(b.dataset.key, $("#fetchBox").checked));
}

function renderRecent() {
  const items = status?.recent ?? [];
  $("#recent").innerHTML = items.length ? items.slice(0, 12).map(r => `
    <button class="row ${current?.key === r.key ? "on" : ""}" data-key="${esc(r.key)}">
      <span class="l1"><span class="key">${esc(r.key)}</span><span class="dot ${r.warnings ? "warn" : "good"}" title="${r.warnings ? n(r.warnings, "thing") + " to fix" : "Ready for QA"}"></span><span class="st">${when(r.generated)}</span></span>
      ${r.summary ? `<span class="t">${esc(r.summary)}</span>` : ""}
    </button>`).join("") : `<p class="note">Nothing yet.</p>`;
  $("#recent").querySelectorAll("[data-key]").forEach(b => b.onclick = () => open(b.dataset.key, false));
}

/* ───────── right: one ticket as a document ───────── */

function blank() {
  $("#doc").innerHTML = `<div class="blank">
    <h1>Which ticket?</h1>
    <p>Pick one of yours on the left, or type a key at the top.</p>
    <p class="muted">A story brings in all of its sub-tasks, whoever is working on them. An epic brings in everything under it. What you see is worked out from git every time, so nobody has to keep notes.</p>
    ${status?.account ? "" : `<p style="margin-top:20px"><button class="btn" id="blankConnect">Connect your Jira account</button></p>`}
  </div>`;
  $("#blankConnect")?.addEventListener("click", openAccount);
}

async function open(key, fetchFirst) {
  key = (key || "").trim().toUpperCase();
  if (!key) return;
  const children = $("#childrenBox").checked;
  $("#keyInput").value = "";
  history.replaceState(null, "", "#" + key);
  commitTicket = "";
  $("#doc").innerHTML = `<div class="working"><span class="key">${esc(key)}</span>
    <p>${children && status?.account ? "Looking up its sub-tasks in Jira, " : ""}${fetchFirst ? `fetching ${status?.repoCount ?? "all"} repositories and reading their history` : "reading the local git history"}…</p>
    <div class="bar"></div></div>`;
  try {
    current = await api(`/api/manifest?key=${encodeURIComponent(key)}&fetch=${fetchFirst ? 1 : 0}&children=${children ? 1 : 0}`);
    render();
    loadStatus(); renderMine();
    window.scrollTo(0, 0);
  } catch (e) {
    $("#doc").innerHTML = `<div class="err"><span class="key">${esc(key)}</span><p>That didn't work: ${esc(e.message)}</p></div>`;
  }
}

function spans(sp) { return sp.map(s => s.url ? a(s.t, s.url) : s.code ? `<code>${esc(s.t)}</code>` : esc(s.t)).join(""); }

// What to do next, in plain words, with a link that does it where possible.
function todoList(r) {
  const out = [];
  for (const repo of r.repos) {
    const target = branchName(repo.defaultRef);
    for (const b of repo.branches.filter(b => b.unmerged)) {
      const localOnly = / \(local only, never pushed\)$/.test(b.name);
      const name = b.name.replace(/ \(local only, never pushed\)$/, "");
      if (localOnly) {
        out.push(`<b>${esc(repo.name)}</b>: push <code>${esc(name)}</code> and merge it into ${esc(target)}. It only exists on this computer (${n(b.unmerged, "commit")}).`);
      } else {
        const mrUrl = repo.webUrl ? `${repo.webUrl}/-/merge_requests/new?merge_request%5Bsource_branch%5D=${encodeURIComponent(name)}&merge_request%5Btarget_branch%5D=${encodeURIComponent(target)}` : null;
        out.push(`<b>${esc(repo.name)}</b>: merge <code>${esc(name)}</code> into ${esc(target)}. ${n(b.unmerged, "commit is", "commits are")} waiting.${mrUrl ? ` ${a("Open a merge request", mrUrl)}` : ""}`);
      }
    }
    const stray = repo.commits.filter(c => !c.inDefault).length - repo.branches.reduce((s, b) => s + b.unmerged, 0);
    if (stray > 0 && !repo.branches.some(b => b.unmerged))
      out.push(`<b>${esc(repo.name)}</b>: ${n(stray, "commit")} mentioning this ticket ${stray === 1 ? "isn't" : "aren't"} in ${esc(target)}, and no branch named after the ticket holds ${stray === 1 ? "it" : "them"}. Check the commits list below.`);
  }
  const lost = r.db.filter(d => d.warning);
  const groups = new Map();
  for (const d of lost) { const k = d.service + "|" + d.status; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(d); }
  for (const g of groups.values()) {
    const d = g[0], files = g.map(x => `<code>${esc(x.file)}</code>`).join(", ");
    if (/STAGED/i.test(d.status)) out.push(`<b>Database, ${esc(d.service)}</b>: move ${files} from <code>dev/</code> into a release folder. QA only gets scripts that are in a release.`);
    else if (/NOT found/i.test(d.status)) out.push(`<b>Database, ${esc(d.service)}</b>: ${files} ${g.length === 1 ? "was" : "were"} removed from <code>dev/</code> but ${g.length === 1 ? "isn't" : "aren't"} in any release. Find where ${g.length === 1 ? "it" : "they"} went before QA.`);
    else out.push(`<b>Database, ${esc(d.service)}</b>: ${files}, ${esc(d.status)}.`);
  }
  return out;
}

// "2026-10-19 15:34" → "today 15:34" / "yesterday 09:10" / "14 Oct"
function when(stamp) {
  const m = /^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}:\d{2}))?/.exec(stamp || "");
  if (!m) return esc(stamp);
  const d = new Date(+m[1], +m[2] - 1, +m[3]), today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - d) / 86400000);
  return diff === 0 ? `today ${m[4] || ""}` : diff === 1 ? `yesterday ${m[4] || ""}` : `${+m[3]} ${months[+m[2] - 1]}`;
}

function tree(scope) {
  const kids = new Map();
  for (const t of scope.slice(1)) { const p = t.parentKey || ""; if (!kids.has(p)) kids.set(p, []); kids.get(p).push(t); }
  const out = [];
  const walk = (t, d) => { out.push({ ...t, depth: d }); (kids.get(t.key) || []).forEach(c => walk(c, d + 1)); };
  if (scope.length) walk(scope[0], 0);
  return out;
}

function render() {
  const r = current, i = r.issue, meId = status?.account?.accountId;
  const kids = r.scope.length - 1;
  const nothing = r.repos.length === 0;
  const openTickets = r.scope.slice(1).filter(t => t.statusCategory !== "done");

  const crumbs = r.ancestors.length ? `<div class="crumbs">${r.ancestors.map(x =>
    `<button data-key="${esc(x.key)}">${esc(x.type)} <span class="key">${esc(x.key)}</span> · ${esc(x.summary)}</button><span>/</span>`).join("")}</div>` : "";

  const facts = [
    i && `<b>${esc(i.type)}</b>`, i && esc(i.status), i && esc(i.assignee),
    kids > 0 && n(kids, "sub-ticket"), i && i.fixVersions !== "none" && `fix version ${esc(i.fixVersions)}`,
    `checked ${when(r.generated)}`,
  ].filter(Boolean).join(" · ");

  let html = `${crumbs}
    ${i ? `<div class="ident"><span class="key">${a(r.key, r.jiraUrl)}</span></div><h1>${esc(i.summary)}</h1>`
        : `<h1>${a(r.key, r.jiraUrl)}</h1>`}
    <div class="facts">${facts}${!i && !status?.account ? ` · <button class="textbtn" id="factsConnect">connect Jira</button> to see its title, status and sub-tasks` : ""}</div>
    <div class="tools">
      <button class="textbtn" id="again">Check again</button>
      <button class="textbtn" id="copy">Copy as Markdown</button>
      <a href="/api/markdown?key=${encodeURIComponent(r.key)}&download=1">Download</a>
      <button class="textbtn" id="post" ${status?.account && !nothing ? "" : "disabled"} title="${status?.account ? "Adds this to the ticket, or updates the one you posted before" : "Connect your Jira account first"}">Post to the Jira ticket</button>
    </div>`;

  if (nothing) {
    html += `<div class="verdict"><h2>No trace of it in git.</h2>
      <p>Nothing in the ${status?.repoCount ?? ""} repositories mentions ${esc(r.key)}${kids ? ` or its ${n(kids, "sub-ticket")}` : ""}: no commit, branch or merge request.
      If the work was pushed from somewhere else, tick <b>fetch</b> and check again.</p></div>`;
    $("#doc").innerHTML = html; wire(); return;
  }

  const todos = todoList(r);
  html += todos.length
    ? `<div class="verdict no"><h2>Not ready for QA yet</h2><p>${n(todos.length, "thing needs", "things need")} doing first:</p>
         <ul class="todo">${todos.map(t => `<li>${t}</li>`).join("")}</ul>
         ${openTickets.length ? `<div class="open-in-jira">Still open in Jira: ${openTickets.map(t => `<span class="key">${esc(t.key)}</span> (${esc(t.assignee)}, ${esc(t.status.toLowerCase())})`).join(", ")}.</div>` : ""}</div>`
    : `<div class="verdict ok"><h2>Ready for QA</h2><p>Everything is merged${r.db.length ? " and every database script is in a release" : ""}.</p>
         ${openTickets.length ? `<div class="open-in-jira">The code is in, but Jira still has ${openTickets.map(t => `<span class="key">${esc(t.key)}</span> (${esc(t.assignee)}, ${esc(t.status.toLowerCase())})`).join(", ")} open.</div>` : ""}</div>`;

  // code, one line per repository
  html += `<section class="s"><h3>Code <span class="c">${n(r.repos.length, "repository", "repositories")}</span></h3>
    <div class="tablewrap"><table><thead><tr><th>Repository</th><th>Merge request</th><th>State</th></tr></thead><tbody>
    ${r.repos.map(repo => {
      const total = repo.commits.length, merged = repo.commits.filter(c => c.inDefault).length;
      const target = branchName(repo.defaultRef);
      const waiting = repo.branches.filter(b => b.unmerged);
      const mrs = repo.merges.length
        ? repo.merges.map(m => m.url ? `${a(m.label, m.url)} <span class="muted">${day(m.date)}</span>` : `<span class="muted" title="Merged without a merge request (${esc(m.label)})">merged directly, ${day(m.date)}</span>`).join(", ")
        : `<span class="muted">none yet</span>`;
      const state = waiting.length
        ? `<span class="warn">${waiting.map(b => `${n(b.unmerged, "commit")} on <code>${esc(b.name)}</code>`).join("; ")} not in ${esc(target)}</span>`
        : merged === total ? `<span class="good">in ${esc(target)}</span>` : `<span class="warn">${total - merged} of ${total} commits not in ${esc(target)}</span>`;
      return `<tr><td class="nw">${a(repo.name, repo.webUrl)}</td><td>${mrs}</td><td>${state}</td></tr>`;
    }).join("")}</tbody></table></div></section>`;

  // database, grouped by service and release folder
  if (r.db.length) {
    const groups = new Map();
    for (const d of r.db) { const k = d.service + "|" + d.location; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(d); }
    html += `<section class="s"><h3>Database <span class="c">${n(r.db.length, "script")}</span></h3>
      <ul class="plain">${[...groups.values()].map(g => {
        const bad = g.filter(d => d.warning), first = g[0];
        const where = first.location === "dev" ? "staged in dev" : `release ${esc(first.location)}`;
        const kinds = new Map();
        for (const d of g) { const k = d.kind || "Other"; if (!kinds.has(k)) kinds.set(k, []); kinds.get(k).push(d.file); }
        const label = { Schema: "Schema", Routines: "Functions", DataSeeding: "Seed data" };
        const files = [...kinds].map(([k, fs]) => `${label[k] || esc(k)}: ${fs.length <= 2 ? fs.map(f => `<code>${esc(f)}</code>`).join(", ")
          : `<span title="${esc(fs.join("\n"))}" style="text-decoration:underline dotted;cursor:help">${fs.length} files</span>`}`).join(" · ");
        return `<li><span class="r">${esc(first.service)} · ${where}</span><span style="flex:1;min-width:240px">${files}
          ${bad.length ? `<div class="warn" style="font-size:13px;margin-top:2px">${esc(bad[0].status)}${bad.length > 1 ? ` (${bad.length} files)` : ""}</div>` : `<div class="good" style="font-size:13px;margin-top:2px">${esc(first.status)}</div>`}</span></li>`;
      }).join("")}</ul></section>`;
  }

  // who did what, when the ticket has sub-tickets
  if (kids > 0) {
    html += `<section class="s"><h3>Who did what <span class="c">${n(r.scope.length, "ticket")}</span></h3>
      <div class="tablewrap"><table><thead><tr><th>Ticket</th><th>Assignee</th><th>Jira</th><th>Code</th></tr></thead><tbody>
      ${tree(r.scope).map(t => `<tr class="${meId && t.assigneeId === meId ? "you" : ""}">
        <td class="${t.depth ? "lvl" + Math.min(t.depth, 2) : ""}"><button class="textbtn key" data-open="${esc(t.key)}">${esc(t.key)}</button> ${esc(t.summary)}<div class="sub">${esc(t.type)}</div></td>
        <td class="nw">${esc(t.assignee)}${meId && t.assigneeId === meId ? ` <span class="muted">(you)</span>` : ""}</td>
        <td class="nw ${t.statusCategory === "done" ? "good" : ""}">${esc(t.status)}</td>
        <td>${t.commits ? `<span class="${t.merged === t.commits ? "good" : "warn"}">${t.merged === t.commits ? `${n(t.commits, "commit")}, all merged` : `${t.merged} of ${t.commits} merged`}</span><div class="sub">${t.repos.map(esc).join(", ")}</div>` : `<span class="muted">no code of its own</span>`}</td>
      </tr>`).join("")}</tbody></table></div></section>`;
  }

  // things a deploy usually forgets
  if (r.highlights.length) {
    html += `<section class="s"><h3>Worth a second look</h3>
      <p class="lead">Files whose names suggest permissions, scopes, menus, configuration or deployment. These are the changes that tend to get forgotten when moving to QA.</p>
      <ul class="plain">${r.highlights.map(h => h.hits.map(x => `<li><span class="r">${esc(h.name)}</span><span><span class="muted">${esc(x.repo)}/</span><code>${esc(x.path)}</code></span></li>`).join("")).join("")}</ul></section>`;
  }

  // the full record, folded away
  html += `<section class="s"><h3>The full record</h3>
    <details class="more" id="filesBox"><summary>Every changed file <span class="c">${r.stats.files}</span></summary><div class="inner">
      <div class="inline-ctl"><input id="fileFilter" placeholder="Filter by path" aria-label="Filter files"></div>
      <div id="fileList">${r.repos.filter(x => x.files.length).map(repo => `<h4>${esc(repo.name)}</h4><ul class="files">${repo.files.map(f =>
        `<li data-p="${esc((repo.name + " " + f.path).toLowerCase())}"><span class="op ${esc(f.status)}" title="${({ A: "added", M: "changed", D: "deleted", R: "renamed" })[f.status] || ""}">${esc(f.status)}</span>${esc(f.path)}</li>`).join("")}</ul>`).join("")}</div>
    </div></details>
    <details class="more" id="commitsBox"><summary>Every commit <span class="c">${r.stats.commits}</span></summary><div class="inner" id="commitList"></div></details>
    ${r.foreign.length ? `<details class="more"><summary>Commits from other tickets that came along on these branches <span class="c">${r.foreign.length}</span></summary><div class="inner">
      <p class="muted" style="margin:0 0 8px;font-size:13px">Not counted above. Usually a branch that was started from another ticket's branch.</p>
      ${r.foreign.map(c => commitHtml(c, null, `${esc(c.otherKey)} · ${esc(c.repo)} · `)).join("")}</div></details>` : ""}
  </section>`;

  $("#doc").innerHTML = html;
  renderCommits();
  wire();
}

function renderCommits() {
  const r = current, multi = r.scope.length > 1;
  const repos = r.repos.map(repo => ({ ...repo, commits: repo.commits.filter(c => !commitTicket || c.ticket === commitTicket) })).filter(x => x.commits.length);
  $("#commitList").innerHTML = `
    ${multi ? `<div class="inline-ctl">Only <select id="ticketSel"><option value="">all tickets</option>${tree(r.scope).filter(t => t.commits).map(t => `<option value="${esc(t.key)}" ${t.key === commitTicket ? "selected" : ""}>${esc(t.key)} (${esc(t.assignee)})</option>`).join("")}</select></div>` : ""}
    ${repos.map(repo => `<h4>${esc(repo.name)}</h4>${repo.commits.map(c => commitHtml(c, repo.defaultRef, multi && c.ticket ? esc(c.ticket) + " · " : "")).join("")}`).join("") || `<p class="muted">None.</p>`}`;
  $("#ticketSel")?.addEventListener("change", e => { commitTicket = e.target.value; renderCommits(); });
}

function commitHtml(c, defaultRef, prefix = "") {
  return `<div class="commit"><div>${a(c.short, c.url)} ${esc(c.subject)}</div>
    <div class="m">${prefix}${esc(c.author)}, ${day(c.date)} · ${c.inDefault ? "merged" : `<span class="warn">not in ${esc(branchName(defaultRef) || "the main branch")}</span>`}</div>
    ${c.note ? `<div class="n">${esc(c.note)}</div>` : ""}</div>`;
}

function wire() {
  const r = current;
  $("#again").onclick = () => open(r.key, true);
  $("#copy").onclick = async () => {
    try { await navigator.clipboard.writeText(await api(`/api/markdown?key=${encodeURIComponent(r.key)}`)); toast("Copied."); }
    catch (e) { toast("Couldn't copy: " + esc(e.message)); }
  };
  $("#post").onclick = async () => {
    const b = $("#post"); b.disabled = true; b.textContent = "Posting…";
    try {
      const res = await api(`/api/post?key=${encodeURIComponent(r.key)}`, { method: "POST" });
      toast(`Posted to ${esc(r.key)} as ${esc(status.account.name)}. <a href="${esc(res.url)}" target="_blank" rel="noopener">See it</a>`, 6000);
    } catch (e) { toast("Jira said no: " + esc(e.message), 6000); }
    finally { b.disabled = false; b.textContent = "Post to the Jira ticket"; }
  };
  $("#factsConnect")?.addEventListener("click", openAccount);
  document.querySelectorAll(".crumbs [data-key]").forEach(b => b.onclick = () => open(b.dataset.key, false));
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => open(b.dataset.open, false));
  $("#fileFilter")?.addEventListener("input", e => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll("#fileList li").forEach(li => li.hidden = q && !li.dataset.p.includes(q));
  });
}

$("#go").onsubmit = e => { e.preventDefault(); open($("#keyInput").value, $("#fetchBox").checked); };
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("#keyInput").focus(); }
});

(async () => {
  await loadStatus();
  loadMine();
  const k = decodeURIComponent(location.hash.slice(1));
  if (k) open(k, false); else blank();
})();
</script>
</body>
</html>
