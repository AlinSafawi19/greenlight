<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feature Ledger</title>
<style>
@font-face { font-family: "Inter"; src: url(/assets/Inter.ttf) format("truetype"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "JBMono"; src: url(/assets/JetBrainsMono.ttf) format("truetype"); font-weight: 100 800; font-display: swap; }

/* ── tokens: graphite console, amber only where a person has to act ── */
:root {
  color-scheme: dark;
  --bg: #0d0f12; --pane: #121519; --raised: #181c21; --hover: #1d2228; --select: #222831;
  --line: #242a32; --line-strong: #2f3640;
  --text: #e4e7eb; --text-2: #a3abb6; --text-3: #6f7884; --text-4: #4b525c;
  --action: #e0a03a; --action-dim: rgba(224, 160, 58, .14);
  --ok: #4fae7c; --ok-dim: rgba(79, 174, 124, .14);
  --confirm: #7f9fd4; --confirm-dim: rgba(127, 159, 212, .14);
  --danger: #e2574c; --danger-dim: rgba(226, 87, 76, .12);
  --focus: #e0a03a;
  --sans: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JBMono", "Cascadia Mono", Consolas, monospace;
  --r: 6px; --r-lg: 8px;
  --t: 140ms cubic-bezier(.2, .6, .2, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 400 13.5px/1.5 var(--sans); font-feature-settings: "cv11", "ss01", "tnum"; -webkit-font-smoothing: antialiased; overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
input, select { font: inherit; color: var(--text); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border: 3px solid transparent; background-clip: padding-box; border-radius: 10px; }
::-webkit-scrollbar-track { background: transparent; }
.mono, .key { font-family: var(--mono); }
.key { font-size: 12px; font-weight: 500; color: var(--text-2); letter-spacing: -.01em; }
.t2 { color: var(--text-2); } .t3 { color: var(--text-3); }
code { font: 12px var(--mono); color: var(--text-2); overflow-wrap: anywhere; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ── components ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: var(--r);
  font-weight: 500; font-size: 13px; white-space: nowrap; border: 1px solid var(--line-strong); background: var(--raised); color: var(--text);
  transition: background var(--t), border-color var(--t), color var(--t); }
.btn:hover:not(:disabled) { background: var(--hover); border-color: #3a424e; }
.btn:active:not(:disabled) { background: var(--select); }
.btn.primary { background: var(--text); border-color: var(--text); color: #0d0f12; }
.btn.primary:hover:not(:disabled) { background: #ffffff; border-color: #ffffff; }
.btn.action { background: var(--action); border-color: var(--action); color: #1a1205; }
.btn.action:hover:not(:disabled) { background: #eab155; border-color: #eab155; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12.5px; }
.btn.icon { width: 30px; padding: 0; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 14px; height: 14px; flex: none; }
kbd { font: 500 10.5px var(--mono); color: var(--text-3); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; line-height: 16px; display: inline-block; }

.badge { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 4px; font-size: 11.5px; font-weight: 500; white-space: nowrap; background: var(--raised); color: var(--text-2); border: 1px solid var(--line); }
.badge.action { background: var(--action-dim); color: var(--action); border-color: transparent; }
.badge.ok { background: var(--ok-dim); color: var(--ok); border-color: transparent; }
.badge.confirm { background: var(--confirm-dim); color: var(--confirm); border-color: transparent; }

/* status icons: shape + colour, so they read without colour too */
.si { width: 14px; height: 14px; flex: none; display: block; }

/* the signature: six thin segments, one per step to QA */
.pipe { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; width: 84px; flex: none; }
.pipe i { height: 4px; border-radius: 1px; background: var(--line-strong); }
.pipe i.done { background: var(--ok); } .pipe i.todo { background: var(--action); } .pipe i.check { background: var(--confirm); }
.pipe i.wait { background: repeating-linear-gradient(90deg, var(--text-4) 0 2px, transparent 2px 4px); }
.pipe i.skip { background: var(--line); }
.pipe.lg { width: 100%; gap: 3px; }
.pipe.lg i { height: 5px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 12.5px; font-weight: 500; color: var(--text-2); }
.input { height: 34px; padding: 0 10px; border-radius: var(--r); border: 1px solid var(--line-strong); background: var(--bg); transition: border-color var(--t); width: 100%; }
.input:hover { border-color: #3a424e; }
.input:focus { outline: none; border-color: var(--text-2); }
.input.bad { border-color: var(--danger); }
.field small { font-size: 12px; color: var(--text-3); }
.field .err { font-size: 12px; color: var(--danger); }

/* ── shell ── */
.app { display: grid; grid-template-rows: 48px minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); height: 100vh; }
.bar { display: flex; align-items: center; gap: 14px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); background: var(--pane); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 13.5px; letter-spacing: -.01em; white-space: nowrap; }
.brand .logo { width: 20px; height: 20px; border-radius: 5px; background: var(--text); display: grid; place-items: center; }
.brand .logo i { width: 8px; height: 8px; border-radius: 2px; background: var(--bg); box-shadow: 4px 4px 0 -1px var(--action); transform: translate(-1px, -1px); }
.sep { width: 1px; height: 20px; background: var(--line); }
.findbtn { display: flex; align-items: center; gap: 8px; height: 30px; width: min(360px, 40vw); padding: 0 8px 0 10px; border-radius: var(--r); border: 1px solid var(--line); background: var(--bg); color: var(--text-3); transition: border-color var(--t); }
.findbtn:hover { border-color: var(--line-strong); color: var(--text-2); }
.findbtn span { flex: 1; text-align: left; }
.bar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.me { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px 0 4px; border-radius: var(--r); }
.me:hover { background: var(--hover); }
.avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--select); border: 1px solid var(--line-strong); display: grid; place-items: center; font-size: 10px; font-weight: 600; color: var(--text-2); }
.check-progress { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 8px; white-space: nowrap; }

.split { display: grid; grid-template-columns: 372px minmax(0, 1fr); min-height: 0; }
.list { border-right: 1px solid var(--line); background: var(--pane); display: grid; grid-template-rows: auto auto 1fr; min-height: 0; }
.list-h { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px; }
.list-h h2 { font-size: 13px; font-weight: 600; margin: 0; }
.list-h .count { font-size: 12px; color: var(--text-3); }
.list-h .btn { margin-left: auto; }
.filters { display: flex; gap: 2px; padding: 0 12px 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.filters button { flex: none; height: 24px; padding: 0 7px; border-radius: 5px; font-size: 12px; color: var(--text-3); display: inline-flex; gap: 6px; align-items: center; transition: background var(--t), color var(--t); }
.filters button:hover { color: var(--text); background: var(--hover); }
.filters button[aria-pressed="true"] { background: var(--select); color: var(--text); }
.filters .n { color: var(--text-4); font-variant-numeric: tabular-nums; }
.filters button[aria-pressed="true"] .n { color: var(--text-3); }
.rows { overflow-y: auto; padding: 6px; }
.tk { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; width: 100%; text-align: left; padding: 9px 10px; border-radius: var(--r); position: relative; transition: background var(--t); }
.tk:hover { background: var(--hover); }
.tk[aria-selected="true"] { background: var(--select); }
.tk[aria-selected="true"]::before { content: ""; position: absolute; left: -6px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--text); }
.tk .title { grid-column: 2 / 4; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tk .meta { grid-column: 2 / 4; display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--text-3); min-width: 0; }
.tk .meta .js { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tk .si { grid-row: 1; }
.tk .ago { font-size: 11px; color: var(--text-4); white-space: nowrap; }
.tk.busy .pipe i { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.group-label { font-size: 11px; font-weight: 600; color: var(--text-4); text-transform: uppercase; letter-spacing: .06em; padding: 12px 10px 4px; }
.list-empty { padding: 28px 18px; color: var(--text-3); font-size: 13px; line-height: 1.55; }
.list-empty b { color: var(--text); font-weight: 600; display: block; margin-bottom: 4px; }
.sk { height: 52px; margin: 2px 4px; border-radius: var(--r); background: linear-gradient(90deg, var(--raised), var(--hover), var(--raised)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ── detail ── */
.detail { overflow-y: auto; min-width: 0; }
.detail-in { max-width: 1180px; padding: 22px 28px 64px; }
.crumbs { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--text-3); margin-bottom: 10px; flex-wrap: wrap; }
.crumbs button { color: var(--text-3); } .crumbs button:hover { color: var(--text); }
.back { display: none; }
.head { display: flex; gap: 16px; align-items: flex-start; }
.head .grow { flex: 1; min-width: 0; }
.head h1 { font-size: 19px; font-weight: 600; letter-spacing: -.015em; line-height: 1.3; margin: 4px 0 8px; }
.head .facts { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--text-3); }
.head .facts b { color: var(--text-2); font-weight: 500; }
.head .acts { display: flex; gap: 6px; flex: none; }
.menu { position: relative; }
.menu-pop { position: absolute; right: 0; top: calc(100% + 4px); min-width: 210px; background: var(--raised); border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: 4px; z-index: 20; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
.menu-pop button, .menu-pop a { display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 10px; border-radius: 5px; font-size: 13px; color: var(--text-2); }
.menu-pop button:hover, .menu-pop a:hover, .menu-pop .on { background: var(--hover); color: var(--text); }
.menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

.summary { margin-top: 18px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--pane); padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 20px; align-items: center; }
.summary .verdict { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.summary .verdict .si { width: 16px; height: 16px; }
.summary .sub { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.summary .fresh { font-size: 12px; color: var(--text-3); text-align: right; white-space: nowrap; }
.summary .fresh button { color: var(--text-2); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.summary .fresh button:hover { color: var(--text); }
.summary .stage-labels { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; font-size: 11px; color: var(--text-3); margin-top: 6px; }
.summary .stage-labels span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.summary .stage-labels .cur { color: var(--action); font-weight: 600; }
.summary .pipe-row { grid-column: 1 / -1; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 24px; margin-top: 22px; align-items: start; }
.section-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; }
.section-h h3 { font-size: 13px; font-weight: 600; margin: 0; }
.section-h span { font-size: 12px; color: var(--text-3); }

.steps { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--pane); overflow: hidden; }
.step + .step { border-top: 1px solid var(--line); }
.step-h { display: grid; grid-template-columns: 14px 20px 110px minmax(0, 1fr) auto 14px; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 11px 14px; transition: background var(--t); }
.step-h:hover { background: var(--hover); }
.step-h .no { font: 500 11px var(--mono); color: var(--text-4); }
.step-h .name { font-weight: 600; font-size: 13px; }
.step-h .hl { color: var(--text-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step-h .chev { width: 14px; height: 14px; color: var(--text-3); transition: transform var(--t); }
.step[data-open="true"] .step-h .chev { transform: rotate(90deg); }
.step[data-open="true"] .step-h { background: var(--raised); }
.step-b { border-top: 1px solid var(--line); background: var(--bg); }
.step-b .means { padding: 10px 14px 4px 58px; font-size: 12px; color: var(--text-3); }
.items { list-style: none; margin: 0; padding: 4px 0 6px; }
.item { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 2px 12px; padding: 9px 14px 9px 34px; align-items: start; }
.item + .item { border-top: 1px solid var(--line); }
.item .si { margin-top: 2px; }
.item .what { font-size: 13px; color: var(--text); overflow-wrap: anywhere; }
.item .detail-t { font-size: 12.5px; color: var(--text-3); margin-top: 1px; overflow-wrap: anywhere; }
.item .repo { font: 500 11px var(--mono); color: var(--text-3); margin-bottom: 1px; }
.item .btn { align-self: center; }
.no-items { padding: 12px 14px 14px 58px; font-size: 12.5px; color: var(--text-3); }

.props { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--pane); padding: 6px 14px; }
.props dl { margin: 0; display: grid; grid-template-columns: 1fr auto; }
.props dt, .props dd { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.props dt { color: var(--text-3); }
.props dd { margin: 0; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
.props dl > :nth-last-child(-n+2) { border-bottom: 0; }
.subtk { list-style: none; margin: 0; padding: 0; }
.subtk li + li { border-top: 1px solid var(--line); }
.subtk button { display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; width: 100%; text-align: left; padding: 8px 0; }
.subtk .s { grid-column: 1 / -1; font-size: 12.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subtk .m { font-size: 11.5px; color: var(--text-3); text-align: right; }
.subtk button:hover .s { color: var(--text); }
.side-stack { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-top: 32px; }
.tabs button { height: 34px; padding: 0 10px; font-size: 13px; color: var(--text-3); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color var(--t); }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--text); border-color: var(--text); }
.tabs .n { color: var(--text-4); margin-left: 4px; font-size: 12px; }
.pane { padding-top: 14px; }
.tool { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.tool .input { width: 280px; height: 30px; }
select.input { width: auto; min-width: 240px; height: 30px; }
table.grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.grid th { text-align: left; font-weight: 500; color: var(--text-3); padding: 0 14px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.grid td { padding: 9px 14px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.grid tr:hover td { background: color-mix(in srgb, var(--hover) 50%, transparent); }
table.grid a:hover { text-decoration: underline; text-underline-offset: 3px; }
.scroll-x { overflow-x: auto; }
.files { list-style: none; margin: 0 0 14px; padding: 0; }
.files li { display: flex; gap: 10px; font: 12px/1.8 var(--mono); color: var(--text-2); overflow-wrap: anywhere; }
.files .op { width: 10px; flex: none; color: var(--text-4); }
.files .op.A { color: var(--ok); } .files .op.D { color: var(--danger); } .files .op.M { color: var(--confirm); }
.repo-h { font-size: 12.5px; font-weight: 600; margin: 16px 0 6px; color: var(--text-2); }
.repo-h:first-child { margin-top: 0; }
.commit { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 1px 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.commit .m { grid-column: 2; font-size: 11.5px; color: var(--text-3); }
.commit .n { grid-column: 2; font-size: 11.5px; color: var(--action); }
.commit a.key:hover { color: var(--text); }

.blank { height: 100%; display: grid; place-items: center; padding: 32px; }
.blank-in { max-width: 420px; text-align: center; color: var(--text-3); }
.blank-in h2 { font-size: 15px; font-weight: 600; color: var(--text); margin: 14px 0 6px; }
.blank-in p { margin: 0 0 16px; font-size: 13px; }
.blank-in .keys { display: flex; gap: 16px; justify-content: center; font-size: 12px; flex-wrap: wrap; }
.blank-in .glyph { width: 40px; height: 40px; margin: 0 auto; border-radius: 10px; border: 1px solid var(--line-strong); display: grid; place-items: center; color: var(--text-3); }
.setup { text-align: left; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--pane); margin-top: 18px; }
.setup .s { display: grid; grid-template-columns: 22px 1fr; gap: 2px 12px; padding: 14px 16px; }
.setup .s + .s { border-top: 1px solid var(--line); }
.setup .num { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; font-size: 11px; color: var(--text-2); }
.setup .num.ok { background: var(--ok); border-color: var(--ok); color: #08130d; }
.setup b { color: var(--text); font-weight: 600; font-size: 13px; }
.setup p { margin: 2px 0 10px; font-size: 12.5px; text-align: left; }
.skel-d { padding: 22px 28px; }
.skel-d .sk { margin: 10px 0; }
.alert { border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); background: var(--danger-dim); border-radius: var(--r-lg); padding: 14px 16px; color: var(--text); font-size: 13px; margin-top: 18px; }
.alert b { color: var(--danger); }

/* ── dialogs ── */
dialog { border: 1px solid var(--line-strong); border-radius: 10px; background: var(--raised); color: var(--text); padding: 0; box-shadow: 0 24px 64px rgba(0,0,0,.55); }
dialog::backdrop { background: rgba(5, 6, 8, .6); }
dialog[open] { animation: appear 140ms ease-out; }
@keyframes appear { from { opacity: 0; transform: translateY(4px) scale(.99); } }
.dlg { width: min(460px, calc(100vw - 32px)); }
.dlg-h { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.dlg-h h2 { font-size: 14px; font-weight: 600; margin: 0; flex: 1; }
.dlg-b { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.dlg-b p { margin: 0; font-size: 12.5px; color: var(--text-3); }
.dlg-f { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
.dlg-f .say { margin-right: auto; font-size: 12.5px; color: var(--text-3); }
.dlg-f .say.bad { color: var(--danger); }
.who-card { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--bg); }
.who-card .avatar { width: 34px; height: 34px; font-size: 12px; }
.who-card small { color: var(--text-3); display: block; }
.divider { height: 1px; background: var(--line); margin: 2px 0; }

.palette { width: min(600px, calc(100vw - 32px)); margin-top: 12vh; }
.palette .in { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); }
.palette .in input { flex: 1; height: 48px; background: none; border: 0; font-size: 14.5px; }
.palette .in input:focus { outline: none; }
.palette .res { max-height: 56vh; overflow-y: auto; padding: 6px; }
.palette .res button { display: grid; grid-template-columns: 14px 78px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; height: 38px; padding: 0 10px; border-radius: var(--r); }
.palette .res button[aria-selected="true"] { background: var(--select); }
.palette .res .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.palette .res .st { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.palette .hint { padding: 12px 16px; font-size: 12.5px; color: var(--text-3); }
.palette .foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--text-3); }

.toast { position: fixed; right: 16px; bottom: 16px; z-index: 50; background: var(--raised); border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: 10px 14px; font-size: 13px; box-shadow: 0 12px 32px rgba(0,0,0,.45);
  display: flex; gap: 10px; align-items: center; max-width: min(460px, calc(100vw - 32px)); transform: translateY(8px); opacity: 0; pointer-events: none; transition: opacity var(--t), transform var(--t); }
.toast.show { opacity: 1; transform: none; pointer-events: auto; }
.toast a { text-decoration: underline; text-underline-offset: 3px; }
.spin { width: 12px; height: 12px; border: 1.5px solid var(--line-strong); border-top-color: var(--text-2); border-radius: 50%; display: inline-block; animation: turn .7s linear infinite; flex: none; }
@keyframes turn { to { transform: rotate(360deg); } }

/* ── narrow screens: list and detail become two pages ── */
@media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } .side-stack { position: static; } }
@media (max-width: 860px) {
  .split { grid-template-columns: 1fr; }
  .split.has-detail .list { display: none; }
  .split:not(.has-detail) .detail { display: none; }
  .back { display: inline-flex; }
  .findbtn { width: auto; flex: 1; min-width: 0; } .findbtn kbd, .brand .label, .sep, .me span:last-child, .check-progress { display: none; } .bar { gap: 8px; padding: 0 8px 0 12px; }
  .detail-in { padding: 16px 16px 48px; }
  .head { flex-direction: column; }
  .step-h { grid-template-columns: 14px minmax(0, 1fr) auto 14px; }
  .step-h .no { display: none; } .step-h .hl { grid-column: 2; grid-row: 2; white-space: normal; }
  .step-h .name { grid-column: 2; }
  .step-b .means, .no-items { padding-left: 38px; }
  .item { padding-left: 14px; grid-template-columns: 14px minmax(0, 1fr); } .item .btn { grid-column: 2; justify-self: start; margin-top: 6px; }
  .summary { grid-template-columns: 1fr; } .summary .fresh { text-align: left; }
  .summary .stage-labels { font-size: 10px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="logo" aria-hidden="true"><i></i></span><span class="label">Feature Ledger</span></div>
    <span class="sep" aria-hidden="true"></span>
    <button class="findbtn" id="findBtn" aria-label="Find a ticket (Ctrl+K)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Find a ticket</span><kbd>Ctrl K</kbd>
    </button>
    <div class="right">
      <span class="check-progress" id="checkProgress" aria-live="polite"></span>
      <button class="btn" id="checkAll" hidden title="Fetch every repository, then check all your tickets">Check all</button>
      <div id="meSlot"></div>
    </div>
  </header>

  <div class="split" id="split">
    <aside class="list" aria-label="Your tickets">
      <div class="list-h"><h2>My tickets</h2><span class="count" id="count"></span>
        <button class="btn ghost icon sm" id="reload" title="Reload from Jira" aria-label="Reload from Jira"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8.5"/><path d="M20 3.5v5h-5"/></svg></button>
      </div>
      <div class="filters" id="filters" role="toolbar" aria-label="Filter"></div>
      <div class="rows" id="rows" role="listbox" aria-label="Tickets" tabindex="0"></div>
    </aside>
    <main class="detail" id="detail" tabindex="-1"></main>
  </div>
</div>

<dialog id="settings" class="dlg" aria-labelledby="setTitle"></dialog>
<dialog id="palette" class="palette" aria-label="Find a ticket">
  <div class="in"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="color:var(--text-3)" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="pq" placeholder="Search your tickets by key or title" aria-label="Search your tickets" role="combobox" aria-controls="pres" aria-expanded="true" spellcheck="false"></div>
  <div class="res" id="pres" role="listbox"></div>
  <div class="foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ── basics ── */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pl = (k, one, many) => `${k} ${k === 1 ? one : (many || one + "s")}`;
const initials = s => (s || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join("");
const cap = s => (s || "").replace(/\b\w/g, c => c.toUpperCase());
const branch = r => (r || "").replace(/^origin\//, "");
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const day = d => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ""); return m ? `${+m[3]} ${MON[+m[2] - 1]}` : esc(d); };
function ago(stamp) {
  const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(stamp || "");
  if (!m) return "";
  const mins = Math.round((Date.now() - new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5])) / 6e4);
  return mins < 1 ? "just now" : mins < 60 ? `${mins}m ago` : mins < 1440 ? `${Math.round(mins / 60)}h ago` : `${Math.round(mins / 1440)}d ago`;
}

const STEPS = [
  { id: "code",   name: "Code",     means: "Every change is merged into the branch the service is built from." },
  { id: "tag",    name: "Tagged",   means: "QA deploys version tags, so the merged code must be inside a tag." },
  { id: "db",     name: "Database", means: "Scripts are in a release folder of db-migration-scripts, and that release is run on the QA database." },
  { id: "access", name: "Access",   means: "Role grants, scopes and menus exist on QA, so testers can reach the feature." },
  { id: "config", name: "Config",   means: "New settings are added to the QA configuration, which lives outside git." },
  { id: "qa",     name: "Handover", means: "The ticket is moved in Jira and the checklist is posted for the tester." },
];
const STATE_WORD = { done: "Done", todo: "Needs action", check: "To confirm", wait: "Waiting", skip: "Not needed", none: "Not checked" };

/* status icon: done ✓, needs action (solid), to confirm (half), waiting (dashed), not needed (dash), not checked (ring) */
function si(state, label = true) {
  const a = label ? `role="img" aria-label="${STATE_WORD[state] || state}"` : `aria-hidden="true"`;
  const svg = inner => `<svg class="si" viewBox="0 0 14 14" ${a}>${inner}</svg>`;
  switch (state) {
    case "done":  return svg(`<circle cx="7" cy="7" r="6.5" fill="var(--ok)"/><path d="m4.2 7.2 1.9 1.9 3.7-4" fill="none" stroke="#0b130e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>`);
    case "todo":  return svg(`<circle cx="7" cy="7" r="5.75" fill="none" stroke="var(--action)" stroke-width="1.5"/><circle cx="7" cy="7" r="3" fill="var(--action)"/>`);
    case "check": return svg(`<circle cx="7" cy="7" r="5.75" fill="none" stroke="var(--confirm)" stroke-width="1.5"/><path d="M7 3.5a3.5 3.5 0 0 1 0 7z" fill="var(--confirm)"/>`);
    case "wait":  return svg(`<circle cx="7" cy="7" r="5.75" fill="none" stroke="var(--text-3)" stroke-width="1.5" stroke-dasharray="2.2 2.2"/>`);
    case "skip":  return svg(`<circle cx="7" cy="7" r="5.75" fill="none" stroke="var(--line-strong)" stroke-width="1.5"/><path d="M4.8 7h4.4" stroke="var(--text-4)" stroke-width="1.5" stroke-linecap="round"/>`);
    default:      return svg(`<circle cx="7" cy="7" r="5.75" fill="none" stroke="var(--line-strong)" stroke-width="1.5"/>`);
  }
}
const pipe = (states, cls = "") => `<span class="pipe ${cls}" aria-hidden="true">${(states || Array(6).fill("none")).map(s => `<i class="${s}"></i>`).join("")}</span>`;
const statesOf = b => b?.stations?.length === 6 ? STEPS.map(s => b.stations.find(x => x.id === s.id)?.state || "none") : null;
function overall(states) {
  if (!states) return "none";
  if (states.includes("todo")) return "todo";
  if (states.includes("wait")) return "wait";
  if (states[5] === "done") return "done";
  return "check";
}
const OVERALL_WORD = { todo: "Blocked", wait: "Waiting", check: "Ready to hand over", done: "With QA", none: "Not checked" };

let status = null, tickets = null, selected = null, report = null, filter = "all", openStep = null, tab = "repos", commitFilter = "", includeKids = true, checking = false, loadSeq = 0;

function toast(html, ms = 4000) {
  const t = $("#toast"); t.innerHTML = html; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), ms);
}
async function api(path, opts = {}) {
  if (opts.method && opts.method !== "GET") opts.headers = { "X-Ledger": "1", "Content-Type": "application/json" };
  const res = await fetch(path, opts);
  const body = res.headers.get("content-type")?.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(body?.error || res.statusText);
  return body;
}

/* ── account / settings ── */
async function loadStatus() {
  try { status = await api("/api/status"); }
  catch { $("#meSlot").innerHTML = `<span class="badge" style="color:var(--danger)">Server not running</span>`; return; }
  const me = status.account;
  $("#meSlot").innerHTML = me
    ? `<button class="me" id="meBtn" aria-label="Account and settings"><span class="avatar">${esc(initials(me.name))}</span><span>${esc(cap(me.name.split(" ")[0]))}</span></button>`
    : `<button class="btn primary" id="meBtn">Connect Jira</button>`;
  $("#meBtn").onclick = openSettings;
  $("#checkAll").hidden = !me;
}

function openSettings() {
  const me = status?.account, d = $("#settings");
  d.innerHTML = `
    <div class="dlg-h"><h2 id="setTitle">${me ? "Account" : "Connect your Jira account"}</h2><button class="btn ghost icon sm" id="setClose" aria-label="Close">✕</button></div>
    <div class="dlg-b">
      ${me ? `
        <div class="who-card"><span class="avatar">${esc(initials(me.name))}</span><div style="flex:1;min-width:0"><div>${esc(cap(me.name))}</div><small>${esc(me.email)} · ${esc(status.jiraBaseUrl.replace("https://", ""))}</small></div><button class="btn sm" id="disc">Disconnect</button></div>
        <p>Your API token is stored in ${esc(me.source)} on this computer. Everything posted to Jira appears under your name.</p>` : `
        <p>The ledger reads the tickets assigned to you and posts handovers as you. The token is stored in Windows Credential Manager on this computer, never in the project.</p>
        ${status?.credentialsRejected ? `<p style="color:var(--danger)">The saved token was rejected by Jira. Enter a new one.</p>` : ""}
        <label class="field"><span>Jira site</span><input class="input" id="fSite" value="${esc(status?.jiraBaseUrl || "")}" spellcheck="false"><span class="err" id="eSite"></span></label>
        <label class="field"><span>Atlassian sign-in email</span><input class="input" id="fEmail" type="email" autocomplete="username" spellcheck="false"><small>Can differ from the email shown on your Jira profile.</small><span class="err" id="eEmail"></span></label>
        <label class="field"><span>API token</span><input class="input" id="fToken" type="password" autocomplete="off"><small><a href="https://id.atlassian.com/manage-profile/security/api-tokens" target="_blank" rel="noopener" style="text-decoration:underline;text-underline-offset:3px">Create a token</a> while signed in as yourself.</small><span class="err" id="eToken"></span></label>`}
      <div class="divider"></div>
      <label class="field"><span>Repositories folder</span><input class="input" id="fRoot" value="${esc(status?.reposRoot || "")}" spellcheck="false"><small>${status ? `${pl(status.repoCount, "repository", "repositories")} found.` : ""} One git repository per subfolder.</small><span class="err" id="eRoot"></span></label>
    </div>
    <div class="dlg-f"><span class="say" id="say"></span>
      <button class="btn" id="saveRoot">Save folder</button>
      ${me ? "" : `<button class="btn primary" id="connect">Connect</button>`}
    </div>`;
  $("#setClose").onclick = () => d.close();
  const say = (t, bad) => { const s = $("#say"); s.className = "say" + (bad ? " bad" : ""); s.innerHTML = t; };
  $("#saveRoot").onclick = async () => {
    $("#eRoot").textContent = "";
    if (!$("#fRoot").value.trim()) { $("#eRoot").textContent = "Enter a folder."; return; }
    try { const r = await api("/api/settings", { method: "POST", body: JSON.stringify({ reposRoot: $("#fRoot").value.trim() }) });
          say(`Saved · ${pl(r.repoCount, "repository", "repositories")} found`); await loadStatus(); }
    catch (e) { $("#eRoot").textContent = e.message; }
  };
  if (me) $("#disc").onclick = async () => {
    await api("/api/account/disconnect", { method: "POST" });
    tickets = null; selected = null; report = null; await loadStatus(); d.close(); boot(); toast("Disconnected. The token was removed from this computer.");
  };
  else $("#connect").onclick = async () => {
    const site = $("#fSite").value.trim(), email = $("#fEmail").value.trim(), token = $("#fToken").value.trim();
    const errs = { eSite: !/^https:\/\/[^/]+/.test(site) ? "Enter the full address, starting with https://" : "",
                   eEmail: !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) ? "Enter a valid email address." : "",
                   eToken: !token ? "Paste your API token." : token.length < 40 ? "That's too short for an API token. Make sure it isn't your password." : "" };
    Object.entries(errs).forEach(([id, m]) => { $("#" + id).textContent = m; $("#" + id).previousElementSibling?.closest?.(".field"); });
    $("#fSite").classList.toggle("bad", !!errs.eSite); $("#fEmail").classList.toggle("bad", !!errs.eEmail); $("#fToken").classList.toggle("bad", !!errs.eToken);
    if (Object.values(errs).some(Boolean)) return;
    const b = $("#connect"); b.disabled = true; say(`<span class="spin"></span> Verifying with Jira…`);
    try {
      const who = await api("/api/account", { method: "POST", body: JSON.stringify({ baseUrl: site, email, token }) });
      tickets = null; await loadStatus(); d.close(); toast(`Connected as ${esc(cap(who.name))}.`); boot();
    } catch (e) { say(esc(e.message), true); }
    finally { b.disabled = false; }
  };
  if (!d.open) d.showModal();
  setTimeout(() => ($("#fEmail") || $("#fRoot")).focus(), 30);
}

/* ── list ── */
async function loadTickets() {
  $("#rows").innerHTML = Array(7).fill(`<div class="sk"></div>`).join("");
  try { tickets = await api("/api/my-tickets"); } catch (e) { tickets = []; toast(esc(e.message)); }
  renderList();
}

function renderList() {
  const me = status?.account;
  if (!me) {
    $("#count").textContent = ""; $("#filters").innerHTML = "";
    $("#rows").innerHTML = `<div class="list-empty"><b>Not connected</b>Connect your Jira account to list the tickets assigned to you.<div style="margin-top:12px"><button class="btn primary" id="lc">Connect Jira</button></div></div>`;
    $("#lc").onclick = openSettings; return;
  }
  const all = tickets || [];
  const groups = { todo: [], wait: [], check: [], none: [], done: [] };
  all.forEach(t => groups[overall(statesOf(t.lastBuild))].push(t));
  const F = [["all", "All", all.length], ["todo", "Blocked", groups.todo.length + groups.wait.length], ["check", "Ready", groups.check.length], ["done", "With QA", groups.done.length], ["none", "Unchecked", groups.none.length]];
  $("#count").textContent = all.length;
  $("#filters").innerHTML = F.map(([id, l, n]) => `<button aria-pressed="${filter === id}" data-f="${id}">${l}<span class="n">${n}</span></button>`).join("");
  $$("#filters [data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; renderList(); });

  const order = ["todo", "wait", "check", "none", "done"];
  const pick = filter === "all" ? order : filter === "todo" ? ["todo", "wait"] : [filter];
  const sections = pick.map(g => [g, groups[g]]).filter(([, l]) => l.length);
  if (!sections.length) { $("#rows").innerHTML = `<div class="list-empty"><b>${all.length ? "Nothing here" : "No open tickets"}</b>${all.length ? "No tickets match this filter." : "Nothing that isn't done is assigned to you in Jira."}</div>`; return; }
  $("#rows").innerHTML = sections.map(([g, l]) => `${filter === "all" ? `<div class="group-label">${OVERALL_WORD[g]}</div>` : ""}${l.map(rowHtml).join("")}`).join("");
  $$("#rows .tk").forEach(b => b.onclick = () => select(b.dataset.key));
}

function rowHtml(t) {
  const st = statesOf(t.lastBuild);
  return `<button class="tk ${checking && t._busy ? "busy" : ""}" role="option" aria-selected="${t.key === selected}" data-key="${esc(t.key)}">
    ${si(overall(st))}<span class="key">${esc(t.key)}</span><span class="ago">${t.lastBuild?.generated ? esc(ago(t.lastBuild.generated)) : ""}</span>
    <span class="title">${esc(t.summary)}</span>
    <span class="meta">${pipe(st)}<span class="js">${esc(t.status)}${t.parentKey ? ` · ${esc(t.parentKey)}` : ""}</span></span>
  </button>`;
}

function moveSelection(dir) {
  const keys = $$("#rows .tk").map(b => b.dataset.key);
  if (!keys.length) return;
  const i = keys.indexOf(selected);
  const next = keys[i === -1 ? 0 : Math.max(0, Math.min(keys.length - 1, i + dir))];
  select(next);
  document.querySelector(`#rows .tk[data-key="${CSS.escape(next)}"]`)?.scrollIntoView({ block: "nearest" });
}

/* ── detail ── */
function select(key, fetchFirst = false) {
  key = (key || "").trim().toUpperCase();
  if (!key) return;
  if (location.hash.slice(1) !== key) history.pushState(null, "", "#" + key);
  load(key, fetchFirst);
}

async function load(key, fetchFirst) {
  selected = key; commitFilter = ""; openStep = null;
  $("#split").classList.add("has-detail");
  $$("#rows .tk").forEach(b => b.setAttribute("aria-selected", b.dataset.key === key));
  document.title = `${key} · Feature Ledger`;
  const n = ++loadSeq;
  $("#detail").innerHTML = `<div class="skel-d"><button class="btn ghost sm back" id="back">← My tickets</button>
    <div class="crumbs" style="margin-top:8px"><span class="key">${esc(key)}</span></div>
    <div class="check-progress" style="margin:6px 0 16px"><span class="spin"></span> ${fetchFirst ? `Fetching ${pl(status?.repoCount ?? 0, "repository", "repositories")}, then checking` : "Checking"}…</div>
    <div class="sk" style="height:76px"></div>${Array(6).fill(`<div class="sk" style="height:42px;margin:6px 0"></div>`).join("")}</div>`;
  $("#back").onclick = backToList;
  try {
    const r = await api(`/api/manifest?key=${encodeURIComponent(key)}&fetch=${fetchFirst ? 1 : 0}&children=${includeKids ? 1 : 0}&mine=1`);
    if (n !== loadSeq) return;
    r.fetched = fetchFirst; report = r;
    const t = tickets?.find(x => x.key === key);
    if (t) { t.lastBuild = { generated: r.generated, stations: r.stations }; renderList(); }
    const st = r.stations.map(s => s.state);
    openStep = r.stations[["todo", "wait", "check"].map(x => st.indexOf(x)).find(i => i !== -1) ?? 5].id;
    renderDetail();
  } catch (e) {
    if (n !== loadSeq) return;
    $("#detail").innerHTML = `<div class="detail-in"><button class="btn ghost sm back" id="back">← My tickets</button><div class="alert"><b>Couldn't check ${esc(key)}.</b> ${esc(e.message)}<div style="margin-top:10px"><button class="btn sm" id="retry">Try again</button></div></div></div>`;
    $("#back").onclick = backToList; $("#retry").onclick = () => load(key, fetchFirst);
  }
}

function backToList() { history.pushState(null, "", location.pathname); selected = null; report = null; $("#split").classList.remove("has-detail"); renderList(); renderBlank(); }

function renderBlank() {
  const me = status?.account;
  document.title = "Feature Ledger";
  $("#detail").innerHTML = `<div class="blank"><div class="blank-in">
    <div class="glyph"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h7"/></svg></div>
    ${me ? `<h2>Select a ticket</h2><p>See what's left before QA can test it: code, tags, database, access, config and the handover.</p>
      <div class="keys"><span><kbd>J</kbd> <kbd>K</kbd> move</span><span><kbd>Ctrl K</kbd> find</span><span><kbd>R</kbd> re-check</span></div>`
    : `<h2>Set up Feature Ledger</h2><p>Two steps, once per computer.</p>
      <div class="setup">
        <div class="s"><span class="num">1</span><div><b>Connect your Jira account</b><p class="t3">Lists your tickets and posts handovers under your name.</p><button class="btn primary sm" id="s1">Connect Jira</button></div></div>
        <div class="s"><span class="num ${status?.repoCount ? "ok" : ""}">${status?.repoCount ? "✓" : "2"}</span><div><b>Repositories folder</b><p class="t3">${status?.repoCount ? `${pl(status.repoCount, "repository", "repositories")} in <code>${esc(status.reposRoot)}</code>` : "Point to the folder with your local clones."}</p><button class="btn sm" id="s2">${status?.repoCount ? "Change" : "Choose folder"}</button></div></div>
      </div>`}
  </div></div>`;
  $("#s1")?.addEventListener("click", openSettings);
  $("#s2")?.addEventListener("click", openSettings);
}

function renderDetail() {
  const r = report, i = r.issue, me = status?.account;
  const st = r.stations.map(s => s.state), ov = overall(st), none = r.repos.length === 0;
  const actions = r.stations.reduce((n, s) => n + s.items.filter(x => x.state === "todo").length, 0);
  const confirms = r.stations.reduce((n, s) => n + s.items.filter(x => x.state === "check").length, 0);
  const cur = st.findIndex(s => s === "todo" || s === "wait");
  const kids = r.scope.length - 1;
  const verdict = none ? ["none", "No trace in git", `Nothing in your repositories mentions ${esc(r.key)}${kids ? ` or your ${pl(kids, "sub-ticket")}` : ""}.`]
    : ov === "todo" ? ["todo", `Blocked at ${STEPS[cur].name}`, `${pl(actions, "action")} before QA can test this${confirms ? `, ${pl(confirms, "item")} to confirm` : ""}.`]
    : ov === "wait" ? ["wait", `Waiting at ${STEPS[cur].name}`, "An earlier step has to finish first."]
    : ov === "done" ? ["done", "With QA", confirms ? `${pl(confirms, "item")} still worth confirming.` : "Every step is done."]
    : ["check", "Ready to hand over", `Nothing blocks QA. ${pl(confirms, "item")} to confirm, then post the handover.`];

  $("#detail").innerHTML = `<div class="detail-in">
    <button class="btn ghost sm back" id="back" style="margin-bottom:8px">← My tickets</button>
    <div class="crumbs">${r.ancestors.map(a => `<button data-go="${esc(a.key)}">${esc(a.type)} <span class="key">${esc(a.key)}</span></button><span>/</span>`).join("")}<a class="key" href="${esc(r.jiraUrl)}" target="_blank" rel="noopener" title="Open in Jira">${esc(r.key)} ↗</a></div>
    <div class="head">
      <div class="grow">
        <h1>${esc(i?.summary || r.key)}</h1>
        <div class="facts">
          ${i ? `<span class="badge">${esc(i.type)}</span><span>Jira: <b>${esc(i.status)}</b></span><span>Owner: <b>${esc(cap(i.assignee))}</b></span>${i.fixVersions !== "none" ? `<span>Fix version: <b>${esc(i.fixVersions)}</b></span>` : ""}`
              : me ? "" : `<span><button class="textlink" id="hc" style="text-decoration:underline;text-underline-offset:3px">Connect Jira</button> to see title, status and sub-tickets</span>`}
          ${me ? `<label style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="kids" ${includeKids ? "checked" : ""}> Include my sub-tickets${kids ? ` (${kids})` : ""}</label>` : ""}
        </div>
      </div>
      <div class="acts">
        <button class="btn" id="recheck" title="Fetch every repository, then check again (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8.5"/><path d="M20 3.5v5h-5"/></svg>Re-check</button>
        <button class="btn primary" id="post" ${me && !none ? "" : "disabled"} title="${me ? "Post the checklist to the Jira ticket (replaces your previous one)" : "Connect Jira first"}">Post handover</button>
        <div class="menu"><button class="btn icon" id="more" aria-haspopup="menu" aria-expanded="false" aria-label="More actions">⋯</button>
          <div class="menu-pop" id="morePop" role="menu" hidden>
            <button role="menuitem" id="copy">Copy checklist</button>
            <a role="menuitem" href="/api/markdown?key=${encodeURIComponent(r.key)}&download=1">Download as Markdown</a>
            <hr><a role="menuitem" href="${esc(r.jiraUrl)}" target="_blank" rel="noopener">Open in Jira ↗</a>
          </div></div>
      </div>
    </div>

    <div class="summary">
      <div><div class="verdict">${si(verdict[0])}${verdict[1]}</div><div class="sub">${verdict[2]}</div></div>
      <div class="fresh">Checked ${esc(ago(r.generated))} · ${r.fetched ? "latest from server" : `local copies · <button id="fetchNow">fetch latest</button>`}</div>
      ${none ? "" : `<div class="pipe-row">${pipe(st, "lg")}</div>
      <div class="stage-labels">${STEPS.map((s, k) => `<span class="${k === cur ? "cur" : ""}">${s.name}</span>`).join("")}</div>`}
    </div>

    ${none ? "" : `
    <div class="cols">
      <section>
        <div class="section-h"><h3>Steps to QA</h3><span>${pl(actions, "action")} · ${pl(confirms, "to confirm", "to confirm")}</span></div>
        <div class="steps" id="steps">${r.stations.map((s, k) => stepHtml(s, k)).join("")}</div>
      </section>
      <aside class="side-stack">
        <div class="props"><dl>
          <dt>Repositories</dt><dd>${r.stats.repos}</dd>
          <dt>Merge requests</dt><dd>${r.stats.mergeRequests}</dd>
          <dt>Commits merged</dt><dd>${r.stats.merged} / ${r.stats.commits}</dd>
          <dt>Files changed</dt><dd>${r.stats.files}</dd>
          <dt>Database scripts</dt><dd>${r.stats.dbScripts}</dd>
        </dl></div>
        ${kids ? `<div class="props"><div class="section-h" style="margin:8px 0 2px"><h3>Your tickets in scope</h3></div><ul class="subtk">${r.scope.map(t => `<li><button data-go="${esc(t.key)}"><span class="key">${esc(t.key)}</span><span class="m">${t.commits ? `${t.merged}/${t.commits} merged` : "no code"}</span><span class="s">${esc(t.summary)}</span></button></li>`).join("")}</ul></div>` : ""}
      </aside>
    </div>

    <div class="tabs" role="tablist">${[["repos", "Repositories", r.repos.length], ["files", "Files", r.stats.files], ["commits", "Commits", r.stats.commits], ...(r.foreign.length ? [["foreign", "Other tickets", r.foreign.length]] : [])]
      .map(([id, l, c]) => `<button role="tab" aria-selected="${tab === id}" data-tab="${id}">${l}<span class="n">${c}</span></button>`).join("")}</div>
    <div class="pane" id="pane"></div>`}
  </div>`;
  wireDetail();
  if (!none) renderPane();
}

function stepHtml(s, k) {
  const open = s.id === openStep;
  const items = [...s.items].sort((a, b) => ["todo", "wait", "check", "done", "skip"].indexOf(a.state) - ["todo", "wait", "check", "done", "skip"].indexOf(b.state));
  return `<div class="step" data-open="${open}" data-id="${s.id}">
    <button class="step-h" aria-expanded="${open}" aria-controls="sb-${s.id}">
      ${si(s.state)}<span class="no">0${k + 1}</span><span class="name">${esc(STEPS[k].name)}</span><span class="hl">${esc(s.headline)}</span>
      ${s.state === "todo" ? `<span class="badge action">${pl(s.items.filter(x => x.state === "todo").length, "action")}</span>` : s.state === "check" ? `<span class="badge confirm">To confirm</span>` : s.state === "done" ? `<span class="badge ok">Done</span>` : `<span class="badge">${STATE_WORD[s.state]}</span>`}
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    <div class="step-b" id="sb-${s.id}" ${open ? "" : "hidden"}>
      <div class="means">${esc(STEPS[k].means)}</div>
      ${items.length ? `<ul class="items">${items.map(it => `<li class="item">${si(it.state)}
        <div>${it.repo ? `<div class="repo">${esc(it.repo)}</div>` : ""}<div class="what">${esc(it.title)}</div>${it.detail ? `<div class="detail-t">${esc(it.detail)}</div>` : ""}</div>
        ${it.actionUrl === "post:" ? `<button class="btn sm action" data-post>${esc(it.actionLabel)}</button>`
          : it.actionUrl ? `<a class="btn sm" href="${esc(it.actionUrl)}" target="_blank" rel="noopener">${esc(it.actionLabel || "Open")} ↗</a>` : ""}
      </li>`).join("")}</ul>` : `<div class="no-items">${esc(s.headline)}.</div>`}
    </div>
  </div>`;
}

function renderPane() {
  const r = report, p = $("#pane");
  if (tab === "repos") {
    p.innerHTML = `<div class="scroll-x"><table class="grid"><thead><tr><th>Repository</th><th>Branch</th><th>Merge requests</th><th>Ticket branches</th><th style="text-align:right">Commits merged</th></tr></thead><tbody>
      ${r.repos.map(x => `<tr><td>${x.webUrl ? `<a href="${esc(x.webUrl)}" target="_blank" rel="noopener">${esc(x.name)}</a>` : esc(x.name)}</td><td><code>${esc(branch(x.defaultRef))}</code></td>
        <td>${x.merges.map(m => m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.label)}</a> <span class="t3">${day(m.date)}</span>` : `<span class="t3">direct merge · ${day(m.date)}</span>`).join("<br>") || `<span class="t3">None</span>`}</td>
        <td>${x.branches.map(b => `<code>${esc(b.name)}</code>${b.unmerged ? ` <span class="badge action">${b.unmerged} unmerged</span>` : ""}`).join("<br>") || `<span class="t3">None</span>`}</td>
        <td style="text-align:right" class="mono">${x.commits.filter(c => c.inDefault).length} / ${x.commits.length}</td></tr>`).join("")}</tbody></table></div>`;
  } else if (tab === "files") {
    p.innerHTML = `<div class="tool"><input class="input" id="ff" placeholder="Filter by path" aria-label="Filter files"></div>
      <div id="fl">${r.repos.filter(x => x.files.length).map(x => `<div class="repo-h">${esc(x.name)} <span class="t3" style="font-weight:400">${x.files.length}</span></div><ul class="files">${x.files.map(f => `<li data-p="${esc((x.name + " " + f.path).toLowerCase())}"><span class="op ${esc(f.status)}" title="${({ A: "Added", M: "Modified", D: "Deleted", R: "Renamed" })[f.status] || ""}">${esc(f.status)}</span><span>${esc(f.path)}</span></li>`).join("")}</ul>`).join("")}</div>`;
    $("#ff").oninput = e => { const q = e.target.value.toLowerCase(); $$("#fl li").forEach(li => li.hidden = q && !li.dataset.p.includes(q)); };
  } else if (tab === "commits") {
    const multi = r.scope.length > 1;
    const repos = r.repos.map(x => ({ ...x, commits: x.commits.filter(c => !commitFilter || c.ticket === commitFilter) })).filter(x => x.commits.length);
    p.innerHTML = `${multi ? `<div class="tool"><select class="input" id="cf" aria-label="Filter by ticket"><option value="">All tickets</option>${r.scope.filter(t => t.commits).map(t => `<option value="${esc(t.key)}" ${t.key === commitFilter ? "selected" : ""}>${esc(t.key)} · ${esc(t.summary)}</option>`).join("")}</select></div>` : ""}
      ${repos.map(x => `<div class="repo-h">${esc(x.name)}</div>${x.commits.map(c => commitHtml(c, x.defaultRef, multi && c.ticket ? `${esc(c.ticket)} · ` : "")).join("")}`).join("") || `<p class="t3">None.</p>`}`;
    $("#cf")?.addEventListener("change", e => { commitFilter = e.target.value; renderPane(); });
  } else {
    p.innerHTML = `<p class="t3" style="margin:0 0 10px;font-size:12.5px">Commits from tickets outside this scope that sit on these branches. Not counted in any step.</p>${r.foreign.map(c => commitHtml(c, null, `${esc(c.otherKey)} · ${esc(c.repo)} · `)).join("")}`;
  }
}

function commitHtml(c, ref, prefix = "") {
  return `<div class="commit"><a class="key" ${c.url ? `href="${esc(c.url)}" target="_blank" rel="noopener"` : ""}>${esc(c.short)}</a><span>${esc(c.subject)}</span>
    <span class="m">${prefix}${esc(c.author)} · ${day(c.date)} · ${c.inDefault ? "merged" : `<span style="color:var(--action)">not in ${esc(branch(ref) || "main")}</span>`}</span>
    ${c.note ? `<span class="n">${esc(c.note)}</span>` : ""}</div>`;
}

function wireDetail() {
  const r = report;
  $("#back").onclick = backToList;
  $("#hc")?.addEventListener("click", openSettings);
  $("#kids")?.addEventListener("change", e => { includeKids = e.target.checked; load(r.key, false); });
  $("#recheck").onclick = () => load(r.key, true);
  $("#fetchNow")?.addEventListener("click", () => load(r.key, true));
  $$("[data-go]").forEach(b => b.onclick = () => select(b.dataset.go));
  $("#post").onclick = post;
  $$("[data-post]").forEach(b => b.onclick = post);
  const more = $("#more"), pop = $("#morePop");
  more.onclick = e => { e.stopPropagation(); pop.hidden = !pop.hidden; more.setAttribute("aria-expanded", !pop.hidden); };
  document.addEventListener("click", () => { pop.hidden = true; more.setAttribute("aria-expanded", "false"); }, { once: true });
  $("#copy").onclick = async () => {
    try { await navigator.clipboard.writeText(await api(`/api/markdown?key=${encodeURIComponent(r.key)}`)); toast("Checklist copied to the clipboard."); }
    catch (e) { toast(`Couldn't copy: ${esc(e.message)}`); }
  };
  $$(".step-h").forEach(h => h.onclick = () => {
    const step = h.closest(".step"), open = step.dataset.open !== "true";
    step.dataset.open = open; h.setAttribute("aria-expanded", open); step.querySelector(".step-b").hidden = !open;
    if (open) openStep = step.dataset.id;
  });
  $$(".tabs [data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; $$(".tabs [data-tab]").forEach(x => x.setAttribute("aria-selected", x === b)); renderPane(); });
}

async function post() {
  const btns = $$("#post, [data-post]");
  btns.forEach(b => { b.disabled = true; b.dataset.l = b.innerHTML; b.innerHTML = `<span class="spin"></span> Posting`; });
  try {
    const res = await api(`/api/post?key=${encodeURIComponent(report.key)}`, { method: "POST" });
    toast(`Handover posted to ${esc(report.key)}. <a href="${esc(res.url)}" target="_blank" rel="noopener">View in Jira</a>`, 6500);
  } catch (e) { toast(`<span style="color:var(--danger)">Jira refused:</span> ${esc(e.message)}`, 6500); }
  finally { btns.forEach(b => { b.disabled = false; b.innerHTML = b.dataset.l; }); }
}

/* ── check all ── */
async function checkAll() {
  if (checking || !tickets?.length) return;
  checking = true; $("#checkAll").disabled = true;
  for (let k = 0; k < tickets.length; k++) {
    const t = tickets[k]; t._busy = true; renderList();
    $("#checkProgress").innerHTML = `<span class="spin"></span> ${k === 0 ? "Fetching repositories · " : ""}${k + 1} of ${tickets.length}`;
    try {
      const r = await api(`/api/manifest?key=${encodeURIComponent(t.key)}&fetch=${k === 0 ? 1 : 0}&children=1&mine=1`);
      t.lastBuild = { generated: r.generated, stations: r.stations };
      if (t.key === selected) { r.fetched = true; report = r; renderDetail(); }
    } catch { }
    t._busy = false;
  }
  checking = false; $("#checkAll").disabled = false; $("#checkProgress").textContent = "";
  renderList(); toast(`All ${pl(tickets.length, "ticket")} checked.`);
}

/* ── find (Ctrl K) ── */
let hits = [], hitIdx = 0, pseq = 0, ptimer;
function openPalette() {
  if (!status?.account) { openSettings(); return; }
  $("#pq").value = ""; hits = (tickets || []).slice(0, 12); hitIdx = 0; drawHits("");
  $("#palette").showModal(); $("#pq").focus();
}
function drawHits(q) {
  const res = $("#pres");
  if (!hits.length) { res.innerHTML = `<div class="hint">${q ? `None of your tickets match “${esc(q)}”.` : "Type a ticket key or words from its title."}</div>`; return; }
  res.innerHTML = (q ? "" : `<div class="hint" style="padding:6px 10px 4px;font-size:11.5px">Your open tickets</div>`) + hits.map((h, k) => `<button role="option" aria-selected="${k === hitIdx}" data-key="${esc(h.key)}">
    ${si(overall(statesOf((tickets || []).find(t => t.key === h.key)?.lastBuild)), false)}<span class="key">${esc(h.key)}</span><span class="t">${esc(h.summary)}</span><span class="st">${esc(h.status)}</span></button>`).join("");
  $$("#pres [data-key]").forEach(b => { b.onclick = () => pickHit(b.dataset.key); b.onmousemove = () => { const i = hits.findIndex(h => h.key === b.dataset.key); if (i !== hitIdx) { hitIdx = i; $$("#pres [data-key]").forEach((x, j) => x.setAttribute("aria-selected", j === i)); } }; });
}
function pickHit(key) { $("#palette").close(); select(key); }
$("#pq").addEventListener("input", () => {
  const q = $("#pq").value.trim();
  clearTimeout(ptimer);
  const local = (tickets || []).filter(t => !q || t.key.toLowerCase().includes(q.toLowerCase()) || (t.summary || "").toLowerCase().includes(q.toLowerCase()));
  hits = local.slice(0, 12); hitIdx = 0; drawHits(q);
  if (q.length < 2) return;
  ptimer = setTimeout(async () => {   // also finds your done and older tickets
    const n = ++pseq;
    try {
      const r = await api(`/api/search?q=${encodeURIComponent(q)}`);
      if (n !== pseq) return;
      const seen = new Set(hits.map(h => h.key));
      hits = [...hits, ...r.filter(x => !seen.has(x.key))].slice(0, 20); drawHits(q);
    } catch { }
  }, 250);
});
$("#pq").addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!hits.length) return; hitIdx = (hitIdx + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length; drawHits($("#pq").value.trim()); $$("#pres [aria-selected=true]")[0]?.scrollIntoView({ block: "nearest" }); }
  if (e.key === "Enter" && hits[hitIdx]) { e.preventDefault(); pickHit(hits[hitIdx].key); }
});
$("#palette").addEventListener("click", e => { if (e.target === $("#palette")) $("#palette").close(); });
$("#settings").addEventListener("click", e => { if (e.target === $("#settings")) $("#settings").close(); });

/* ── keyboard ── */
document.addEventListener("keydown", e => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName) || $("#palette").open || $("#settings").open;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); openPalette(); }
  else if (e.key === "j" || e.key === "ArrowDown" && document.activeElement?.closest?.("#rows")) { e.preventDefault(); moveSelection(1); }
  else if (e.key === "k" || e.key === "ArrowUp" && document.activeElement?.closest?.("#rows")) { e.preventDefault(); moveSelection(-1); }
  else if (e.key === "r" && report) { load(report.key, true); }
});

/* ── boot ── */
$("#findBtn").onclick = openPalette;
$("#checkAll").onclick = checkAll;
$("#reload").onclick = () => status?.account && loadTickets();
window.addEventListener("popstate", () => { const k = decodeURIComponent(location.hash.slice(1)).toUpperCase(); if (k) load(k, false); else backToList(); });

async function boot() {
  await loadStatus();
  if (status?.account) await loadTickets(); else renderList();
  const k = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  if (k) load(k, false); else renderBlank();
}
boot();
</script>
</body>
</html>
